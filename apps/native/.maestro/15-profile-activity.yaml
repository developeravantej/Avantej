appId: ${APP_ID}
---
# Test: Profile → Recent Activity full list
- runFlow: helpers/login.yaml

# Navigate to Profile
- tapOn:
    text: ".*Profile.*"
- waitForAnimationToEnd

# Tap Recent Activity
- scrollUntilVisible:
    element:
      text: ".*Recent Activity.*"
    direction: DOWN
- tapOn:
    text: ".*Recent Activity.*"
- waitForAnimationToEnd

# Verify activity screen loaded
- extendedWaitUntil:
    visible:
      text: ".*Activity.*|.*Recent.*"
    timeout: 5000

# Scroll to load more
- swipe:
    start: "50%, 70%"
    end: "50%, 30%"
    duration: 500
- waitForAnimationToEnd

# Go back
- back
- waitForAnimationToEnd
