appId: ${APP_ID}
---
# Actual login form — called conditionally from login.yaml
- tapOn: "Enter your email"
- inputText: "customer@gmail.com"
- tapOn: "Enter your password"
- inputText: "password123"
- tapOn: "Sign In"
- waitForAnimationToEnd
- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: ".*Good Morning.*|.*Good Afternoon.*|.*Good Evening.*"
    timeout: 15000
