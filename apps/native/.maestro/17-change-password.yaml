appId: ${APP_ID}
---
# Test: Change password modal from profile
- runFlow: helpers/login.yaml

# Navigate to Profile
- tapOn:
    text: ".*Profile.*"
- waitForAnimationToEnd

# Tap Change Password
- scrollUntilVisible:
    element:
      text: ".*Change Password.*|.*Password.*"
    direction: DOWN
- tapOn:
    text: ".*Change Password.*|.*Password.*"
- waitForAnimationToEnd

# Verify change password modal/screen
- extendedWaitUntil:
    visible:
      text: ".*Current.*Password.*|.*New.*Password.*|.*Change.*Password.*"
    timeout: 5000

# Close/dismiss without submitting
- back
- waitForAnimationToEnd
