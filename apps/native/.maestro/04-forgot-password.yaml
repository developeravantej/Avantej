appId: ${APP_ID}
---
# Test: Forgot Password flow
# Assumes we're on login screen (run after logout)
- runFlow:
    when:
      platform: Android
    file: helpers/reset-android.yaml
- runFlow:
    when:
      platform: iOS
    file: helpers/reset-ios.yaml
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 30000

# Navigate to forgot password
- tapOn: "Forgot Password?"
- waitForAnimationToEnd

# Wait for forgot password screen
- extendedWaitUntil:
    visible: "Send Reset Link"
    timeout: 5000

# Enter email and submit
- tapOn: "Enter your email"
- inputText: "customer@gmail.com"
- tapOn:
    point: "50%, 20%"
- tapOn: "Send Reset Link"
- waitForAnimationToEnd

# Verify success screen
- extendedWaitUntil:
    visible: "Check Your Email"
    timeout: 10000
