# Verify dashboard sections
- assertVisible:
    text: ".*Book.*Session.*"
- assertVisible:
    text: ".*Buy.*Package.*"
- assertVisible:
    text: ".*Calendar.*"
- assertVisible:
    text: ".*My.*Credits.*"

# Verify active plan card
- assertVisible:
