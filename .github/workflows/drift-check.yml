# Schema drift gate.
#
# Fails the PR if Drizzle schema source has drifted from the live tenant /
# control-panel database (missing FKs, extra FKs, ON DELETE/UPDATE action
# mismatches, orphan tables, etc.) or if the embedded tenant-migrations
# generated module is out of sync with packages/db/src/migrations/tenant/*.sql.
#
# `bun scripts/gen-erd.ts` connects to live databases via DATABASE_URL
# (control-panel DB; it then derives each tenant's connection string from
# the `organizations` table). A read-only credential is sufficient and is
# passed via the `DRIFT_CHECK_DATABASE_URL` repo secret.
name: Schema Drift Check

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "packages/db/**"
      - "packages/services/**"
      - "apps/server/src/**"
      - "scripts/gen-erd.ts"
      - "scripts/check-drift.ts"
      - "scripts/gen-tenant-migrations.ts"
      - "scripts/verify-migrations-generated.ts"
      - ".github/workflows/drift-check.yml"

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/bun-setup

      - name: Verify tenant-migrations generated module is in sync
        run: bun verify:migrations

      - name: Generate ERD + drift report
        env:
          DATABASE_URL: ${{ secrets.DRIFT_CHECK_DATABASE_URL }}
          # gen-erd derives each tenant's connection string from the
          # organizations table, which is encrypted at rest — decryption
          # needs the same key the server uses.
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          # Preferred schema-reference tenant. When set, gen-erd uses it
          # directly instead of discovering a decryptable org — required in
          # CI, where the control-panel DB holds only undecryptable throwaway
          # e2e test orgs. Point this secret at a stable, migrated tenant Neon
          # branch (read-only creds suffice). Until the secret exists it is
          # empty and gen-erd falls back to org discovery (current behaviour).
          TENANT_DATABASE_URL: ${{ secrets.DRIFT_CHECK_TENANT_DATABASE_URL }}
        run: bun scripts/gen-erd.ts

      - name: Check drift (fails on any drift section)
        run: bun scripts/check-drift.ts
