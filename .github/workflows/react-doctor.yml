name: React Doctor

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/web/**"
      - "apps/native/**"
      - "packages/**"
      - "react-doctor.config.json"
      - ".github/workflows/react-doctor.yml"
  push:
    branches: [main, dev]
    paths:
      - "apps/web/**"
      - "apps/native/**"
      - "packages/**"
      - "react-doctor.config.json"

permissions:
  contents: read
  pull-requests: write

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: web
            directory: apps/web
          - name: native
            directory: apps/native
    name: scan (${{ matrix.target.name }})
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The action's input schema changed upstream (diff/github-token/fail-on/
      # verbose were removed; it now takes directory/scope/blocking/comment).
      # Advisory scan: report findings, never block the PR.
      - uses: millionco/react-doctor@main
        with:
          directory: ${{ matrix.target.directory }}
          blocking: false
