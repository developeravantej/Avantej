<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Avantej Dashboard — Popup Inventory</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
    line-height: 1.5;
  }

  header {
    background: #fff;
    border-bottom: 1px solid #e5e5e5;
    padding: 20px 32px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  header h1 { font-size: 1.25rem; font-weight: 700; flex-shrink: 0; }
  header p { font-size: 0.85rem; color: #666; flex-shrink: 0; }

  #search {
    margin-left: auto;
    padding: 8px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.875rem;
    width: 260px;
    outline: none;
  }
  #search:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }

  .filter-row {
    display: flex;
    gap: 8px;
    padding: 12px 32px;
    background: #fff;
    border-bottom: 1px solid #e5e5e5;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid #d1d5db;
    background: #fff;
    font-size: 0.78rem;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.15s;
  }
  .filter-btn:hover { background: #f3f4f6; }
  .filter-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

  main { max-width: 1400px; margin: 0 auto; padding: 32px; }

  .section { margin-bottom: 48px; }
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .section-title { font-size: 1.1rem; font-weight: 700; }
  .section-count {
    background: #f3f4f6;
    color: #555;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 12px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 14px;
  }

  .card {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 18px;
    transition: box-shadow 0.15s;
  }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  .card.hidden { display: none; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .card-title { font-size: 0.95rem; font-weight: 700; flex: 1; }

  .badge {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-Dialog        { background: #ede9fe; color: #5b21b6; }
  .badge-Sheet         { background: #d1fae5; color: #065f46; }
  .badge-AlertDialog   { background: #fee2e2; color: #991b1b; }
  .badge-Drawer        { background: #fef3c7; color: #92400e; }
  .badge-Popover       { background: #e0e7ff; color: #3730a3; }
  .badge-DropdownMenu  { background: #f3f4f6; color: #374151; }

  .url-path {
    font-size: 0.72rem;
    color: #9ca3af;
    font-family: monospace;
    margin-bottom: 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .description {
    font-size: 0.82rem;
    color: #555;
    margin-bottom: 10px;
  }

  .meta-row {
    font-size: 0.78rem;
    color: #374151;
    margin-bottom: 8px;
  }
  .meta-label {
    font-weight: 600;
    color: #1a1a1a;
    margin-right: 4px;
  }

  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .tag {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    font-size: 0.72rem;
    padding: 2px 7px;
    color: #374151;
  }
  .tag-action { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }

  .empty { text-align: center; padding: 64px 0; color: #9ca3af; font-size: 0.95rem; }

  .stats {
    display: flex;
    gap: 24px;
    padding: 16px 32px;
    background: #fff;
    border-bottom: 1px solid #e5e5e5;
    font-size: 0.8rem;
    color: #666;
  }
  .stats span b { color: #1a1a1a; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Avantej — Dashboard Popup Inventory</h1>
    <p>All dialogs, sheets, drawers &amp; alert dialogs across dashboard pages</p>
  </div>
  <input id="search" type="text" placeholder="Search by title, page, field…" oninput="filterCards()" />
</header>

<div class="stats" id="stats"></div>

<div class="filter-row" id="filterRow">
  <button class="filter-btn active" data-type="all" onclick="setType('all',this)">All</button>
  <button class="filter-btn" data-type="Dialog" onclick="setType('Dialog',this)">Dialog</button>
  <button class="filter-btn" data-type="Sheet" onclick="setType('Sheet',this)">Sheet</button>
  <button class="filter-btn" data-type="Drawer" onclick="setType('Drawer',this)">Drawer</button>
  <button class="filter-btn" data-type="AlertDialog" onclick="setType('AlertDialog',this)">AlertDialog</button>
  <button class="filter-btn" data-type="Popover" onclick="setType('Popover',this)">Popover</button>
  <button class="filter-btn" data-type="DropdownMenu" onclick="setType('DropdownMenu',this)">DropdownMenu</button>
</div>

<main id="main"></main>

// ── Render ──────────────────────────────────────────────────────────────────
let activeType = "all";
let searchTerm = "";

function setType(type, btn) {
  activeType = type;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderAll();
}

function filterCards() {
  searchTerm = document.getElementById("search").value.toLowerCase();
  renderAll();
}

function cardMatches(d) {
  if (activeType !== "all" && d.popup_type !== activeType) return false;
  if (!searchTerm) return true;
  const haystack = [d.section, d.page, d.title, d.description, d.trigger, ...(d.fields || []), ...(d.actions || []), d.url_path].join(" ").toLowerCase();
  return haystack.includes(searchTerm);
}

function renderAll() {
  const main = document.getElementById("main");
  main.innerHTML = "";

  const sections = [...new Set(DATA.map(d => d.section))];
  let totalVisible = 0;

  for (const section of sections) {
    const items = DATA.filter(d => d.section === section && cardMatches(d));
    if (items.length === 0) continue;
    totalVisible += items.length;

    const sec = document.createElement("div");
    sec.className = "section";
    sec.innerHTML = `<div class="section-header"><span class="section-title">${section}</span><span class="section-count">${items.length}</span></div>`;

    const grid = document.createElement("div");
    grid.className = "grid";

    for (const d of items) {
      const card = document.createElement("div");
      card.className = "card";

      const fieldsHtml = d.fields && d.fields.length
        ? `<div class="meta-row"><span class="meta-label">Fields</span><div class="tags">${d.fields.map(f => `<span class="tag">${f}</span>`).join("")}</div></div>`
        : "";

      const actionsHtml = d.actions && d.actions.length
        ? `<div class="meta-row"><span class="meta-label">Actions</span><div class="tags">${d.actions.map(a => `<span class="tag tag-action">${a}</span>`).join("")}</div></div>`
        : "";

      card.innerHTML = `
        <div class="card-top">
          <div class="card-title">${d.title}</div>
          <span class="badge badge-${d.popup_type}">${d.popup_type}</span>
        </div>
        <div class="url-path">${d.url_path}</div>
        <div class="description">${d.description}</div>
        <div class="meta-row"><span class="meta-label">Trigger:</span>${d.trigger}</div>
        ${fieldsHtml}
        ${actionsHtml}
      `;
      grid.appendChild(card);
    }

    sec.appendChild(grid);
    main.appendChild(sec);
  }

  if (totalVisible === 0) {
    main.innerHTML = `<div class="empty">No popups match your search.</div>`;
  }

  const typeCounts = {};
  DATA.forEach(d => { typeCounts[d.popup_type] = (typeCounts[d.popup_type] || 0) + 1; });
  const statsEl = document.getElementById("stats");
  statsEl.innerHTML = `<span><b>${totalVisible}</b> shown of <b>${DATA.length}</b> total</span>` +
    Object.entries(typeCounts).map(([t,c]) => `<span>${t}: <b>${c}</b></span>`).join("");
}

renderAll();
</script>
</body>
</html>
